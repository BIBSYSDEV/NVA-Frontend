# buildspec file for the NVA-frontend-github-check build in AWS (dev). Used to run tests with mock data for PRs in GitHub.

version: 0.2

env:
  variables:
    VITE_API_HOST: 'https://my-nva-api.no'
    VITE_USE_MOCK: 'true'

phases:
  install:
    runtime-versions:
      # Keep in sync with .nvmrc and package.json engines
      nodejs: 24
    commands:
      - node -v
      # https://docs.cypress.io/guides/getting-started/installing-cypress#Amazon-Linux-2023
      # NOTE: These also cover Chromium for the Vitest browser tests, except mesa-libgbm and libxkbcommon.
      # Playwright's --with-deps only supports Debian and Ubuntu, so the packages are installed here instead.
      - dnf install -y xorg-x11-server-Xvfb gtk3-devel nss alsa-lib mesa-libgbm libxkbcommon
      - npm ci
      # npm ci skips the Playwright browser download because of ignore-scripts in .npmrc
      - npx playwright install chromium
  build:
    commands:
      - npm run build
      - npm run test:vitest
      - npm run test:cypress:ci
