# file added for AWS amplify, setting security headers. See https://docs.aws.amazon.com/amplify/latest/userguide/custom-headers.html#example-security-headers
# font-src cdn.jsdelivr.net is added for MathJax fonts. MathJax itself is bundled with the app.
# style-src unsafe-inline is added because of MUI and Styled components.
customHeaders:
  - pattern: '**'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'
      - key: 'X-XSS-Protection'
        value: '1; mode=block'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; img-src 'self' * data: blob:; script-src 'self' https://matomo.sikt.no; style-src 'self' 'unsafe-inline' static:; connect-src *.s3.eu-west-1.amazonaws.com *.datacite.org datacite.org doi.org sandbox.orcid.org orcid.org *.amazoncognito.com cognito-idp.eu-west-1.amazonaws.com/ *.nva.aws.unit.no api.nva.unit.no matomo.sikt.no data:; font-src 'self' cdn.jsdelivr.net data:; frame-src 'self' app.powerbi.com rapport-dv.educloud.no view.officeapps.live.com d1wf4blr0an30g.cloudfront.net d1ldveylzpt370.cloudfront.net diywq38j1xmei.cloudfront.net d22sgn8dyu728x.cloudfront.net *.s3.eu-west-1.amazonaws.com data:; object-src *.s3.eu-west-1.amazonaws.com data:"
